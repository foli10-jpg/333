<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Chat – bisedo me video me dikë të ri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1236;--panel:#2a1e52;--line:#41317a;--text:#f4f0ff;--mute:#a99fd0;--pink:#ff4d94;--gold:#ffc53d;--teal:#3ee6c4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:.6em 1em;background:var(--line);font-weight:600}
button:hover{filter:brightness(1.15)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button.pink{background:var(--pink);color:#fff}button.gold{background:var(--gold);color:#2b1d00}
input,select{background:#1b1236;border:1px solid var(--line);border-radius:10px;padding:.65em .8em;width:100%}
header{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin-right:auto}.logo b{color:var(--pink)}
.chip{background:var(--panel);border-radius:99px;padding:.3em .8em;font-weight:600;white-space:nowrap}
.chip.vip{background:var(--gold);color:#2b1d00}
.hidden{display:none!important}
#auth,#banned{margin:auto;width:min(420px,92vw);background:var(--panel);padding:1.6rem;border-radius:18px}
#auth h1{margin:0 0 .3rem;font-size:2rem;letter-spacing:-.03em}
#auth p{color:var(--mute);margin:.2rem 0 1rem}
#auth form{display:grid;gap:.7rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}.tabs button{flex:1}.tabs .on{background:var(--pink)}
.chk{display:flex;gap:.5rem;align-items:center;font-size:.9rem;color:var(--mute)}.chk input{width:auto}
#err{color:var(--pink);min-height:1.4em;margin:.5rem 0 0}
#chat{flex:1;display:grid;grid-template-columns:1fr 340px;gap:1rem;padding:1rem;min-height:0}
.stage{position:relative;background:#000;border-radius:18px;overflow:hidden;min-height:260px}
#rv{width:100%;height:100%;object-fit:cover;background:#120b26}
#lv{position:absolute;right:12px;bottom:12px;width:26%;max-width:200px;border-radius:12px;border:2px solid var(--line);transform:scaleX(-1);background:#120b26}
#status{position:absolute;left:12px;top:12px;background:rgba(27,18,54,.85);padding:.35em .8em;border-radius:99px;font-weight:600}
#gifts{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:5rem;pointer-events:none}
aside{display:flex;flex-direction:column;gap:.7rem;min-height:0}
.row{display:flex;gap:.5rem}.row>*{flex:1}
#log{flex:1;background:var(--panel);border-radius:14px;padding:.8rem;overflow:auto;display:flex;flex-direction:column;gap:.35rem;min-height:140px}
.m{max-width:85%;padding:.35em .7em;border-radius:12px;background:var(--line);word-break:break-word}
.m.me{align-self:flex-end;background:var(--pink)}.m.sys{align-self:center;background:none;color:var(--mute);font-size:.85rem}
dialog{border:0;border-radius:18px;background:var(--panel);color:var(--text);padding:1.4rem;width:min(460px,92vw)}
dialog::backdrop{background:rgba(10,5,25,.7)}
.item{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
@media(max-width:800px){#chat{grid-template-columns:1fr;grid-template-rows:55vh 1fr}}
@media(prefers-reduced-motion:no-preference){#gifts.pop{animation:pop 1.6s ease-out}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
</style>
</head>
<body>
<header>
  <div class="logo">Big<b>Chat</b></div>
  <span id="coinsChip" class="chip hidden"></span><span id="vipChip" class="chip vip hidden">VIP</span>
  <button id="shopBtn" class="gold hidden">Dyqani</button><button id="logoutBtn" class="hidden">Dil</button>
</header>

<section id="auth">
  <h1>Takohu me dikë të ri</h1>
  <p>Video bisedë e rastësishme. Kliko Next dhe vazhdo me tjetrin.</p>
  <div class="tabs"><button id="tLogin" class="on">Hyr</button><button id="tReg">Regjistrohu</button></div>
  <form id="authForm">
    <input id="username" placeholder="Username" autocomplete="username" class="hidden">
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="password" type="password" placeholder="Fjalëkalimi" autocomplete="current-password" required>
    <select id="country" class="hidden"></select>
    <label class="chk hidden" id="adultRow"><input id="adult" type="checkbox">Kam mbi 18 vjeç dhe pranoj <a href="/terms.html" target="_blank" style="color:var(--teal)">rregullat</a></label>
    <button class="pink" id="authBtn">Hyr</button>
  </form>
  <div id="err" role="alert"></div>
</section>

<section id="banned" class="hidden">
  <h2 style="margin-top:0">Llogaria jote është e bllokuar</h2>
  <p id="banInfo" style="color:var(--mute)"></p>
  <div class="row"><button id="unbanCoins" class="gold"></button><button id="unbanPay" class="pink">Paguaj €2.99</button></div>
  <div id="banErr" style="color:var(--pink);margin-top:.6rem"></div>
</section>

<main id="chat" class="hidden">
  <div class="stage">
    <video id="rv" autoplay playsinline></video>
    <video id="lv" autoplay playsinline muted></video>
    <div id="status">Gati për të filluar</div>
    <div id="gifts"></div>
  </div>
  <aside>
    <div class="row"><button id="startBtn" class="pink">Fillo</button><button id="nextBtn" disabled>Next</button><button id="stopBtn" disabled>Ndalo</button></div>
    <select id="filter" title="Filtër sipas shtetit"></select>
    <div id="log"></div>
    <form id="msgForm" class="row"><input id="msgIn" placeholder="Shkruaj mesazh…" autocomplete="off" maxlength="500" disabled><button style="flex:0 0 auto" disabled id="sendBtn">Dërgo</button></form>
    <div class="row" id="giftRow"></div>
    <button id="reportBtn" disabled>Raporto përdoruesin</button>
  </aside>
</main>

<dialog id="shop">
  <h2 style="margin-top:0">Dyqani</h2><div id="items"></div>
  <p id="shopErr" style="color:var(--pink)"></p>
  <button id="closeShop" style="margin-top:.6rem">Mbyll</button>
</dialog>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const COUNTRIES = {XK:'Kosovë',AL:'Shqipëri',MK:'Maqedoni',ME:'Mal i Zi',DE:'Gjermani',CH:'Zvicër',AT:'Austri',IT:'Itali',FR:'Francë',GB:'Britani',US:'SHBA',TR:'Turqi'};
const GIFT_ICON = {rose:'🌹',heart:'💖',diamond:'💎'};
let token = localStorage.getItem('bc_token'), me, socket, pc, local, ice, shop, inMatch = false, regMode = false;

for (const [c, n] of Object.entries(COUNTRIES)) $('country').add(new Option(n, c));
$('filter').add(new Option('Çdo shtet', ''));
for (const [c, n] of Object.entries(COUNTRIES)) $('filter').add(new Option('Vetëm ' + n, c));

const api = async (url, body, method) => {
  const r = await fetch(url, { method: method || (body ? 'POST' : 'GET'), headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Gabim (' + r.status + ')');
  return d;
};
const log = (t, cls = 'sys') => { const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = t; $('log').append(d); $('log').scrollTop = 1e9; };
const setStatus = t => $('status').textContent = t;

// ----- Auth -----
function mode(reg) {
  regMode = reg; $('tReg').classList.toggle('on', reg); $('tLogin').classList.toggle('on', !reg);
  ['username', 'country', 'adultRow'].forEach(i => $(i).classList.toggle('hidden', !reg));
  $('authBtn').textContent = reg ? 'Krijo llogari' : 'Hyr';
}
$('tLogin').onclick = () => mode(false); $('tReg').onclick = () => mode(true);
$('authForm').onsubmit = async e => {
  e.preventDefault(); $('err').textContent = '';
  try {
    const d = await api(regMode ? '/api/register' : '/api/login', { username: $('username').value, email: $('email').value, password: $('password').value, country: $('country').value, adult: $('adult').checked });
    token = d.token; localStorage.setItem('bc_token', token); await boot();
  } catch (x) { $('err').textContent = x.message; }
};
$('logoutBtn').onclick = () => { localStorage.removeItem('bc_token'); location.reload(); };

function renderMe() {
  $('coinsChip').textContent = '🪙 ' + me.coins; $('vipChip').classList.toggle('hidden', !me.isVip);
}
async function boot() {
  if (!token) return;
  try { me = await api('/api/me'); } catch { localStorage.removeItem('bc_token'); token = null; return; }
  shop = await api('/api/shop');
  $('auth').classList.add('hidden');
  ['coinsChip', 'shopBtn', 'logoutBtn'].forEach(i => $(i).classList.remove('hidden')); renderMe();
  if (me.banned) return showBan();
  $('chat').classList.remove('hidden'); buildGifts(); buildShop();
  ice = await api('/api/ice');
  try { local = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); $('lv').srcObject = local; }
  catch { setStatus('Lejo kamerën dhe mikrofonin për të vazhduar'); $('startBtn').disabled = true; return; }
  connect();
}

// ----- Ban -----
function showBan() {
  $('chat').classList.add('hidden'); $('banned').classList.remove('hidden');
  $('banInfo').textContent = (me.banReason || 'Shkelje e rregullave') + (me.banUntil ? ' · deri më ' + new Date(me.banUntil).toLocaleString() : ' · pa afat');
  $('unbanCoins').textContent = `Zhblloko me ${shop.unbanCoins} coins`;
}
$('unbanCoins').onclick = async () => { try { me = await api('/api/unban-coins', {}); location.reload(); } catch (x) { $('banErr').textContent = x.message; } };
$('unbanPay').onclick = async () => { try { location = (await api('/api/checkout', { item: 'unban' })).url; } catch (x) { $('banErr').textContent = x.message; } };

// ----- Dyqani -----
function buildShop() {
  $('items').innerHTML = '';
  for (const [k, it] of Object.entries(shop.items)) {
    if (k === 'unban') continue;
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<span>${it.name}</span>`; const b = document.createElement('button'); b.className = 'pink'; b.textContent = '€' + (it.cents / 100).toFixed(2);
    b.onclick = async () => { try { location = (await api('/api/checkout', { item: k })).url; } catch (x) { $('shopErr').textContent = x.message; } };
    d.append(b); $('items').append(d);
  }
}
$('shopBtn').onclick = () => $('shop').showModal(); $('closeShop').onclick = () => $('shop').close();
function buildGifts() {
  $('giftRow').innerHTML = '';
  for (const [k, c] of Object.entries(shop.gifts)) {
    const b = document.createElement('button'); b.textContent = `${GIFT_ICON[k]} ${c}`; b.disabled = true; b.dataset.gift = k;
    b.onclick = () => socket.emit('gift', k); $('giftRow').append(b);
  }
}

// ----- Socket + WebRTC -----
function connect() {
  socket = io({ auth: { token } });
  socket.on('connect_error', async e => { if (e.message === 'banned') { me = await api('/api/me'); showBan(); } else setStatus('Lidhja dështoi'); });
  socket.on('banned', async () => { teardown(); me = await api('/api/me'); showBan(); });
  socket.on('coins', c => { me.coins = c; renderMe(); });
  socket.on('err', t => { log(t); setStatus('Gati'); ui(false); });
  socket.on('waiting', () => { setStatus('Po kërkojmë dikë…'); ui(true, false); });
  socket.on('matched', async m => {
    inMatch = true; $('log').innerHTML = ''; ui(true, true);
    setStatus(`${m.name} · ${COUNTRIES[m.country] || m.country}`); log('Je lidhur me ' + m.name);
    newPC();
    if (m.initiator) { const o = await pc.createOffer(); await pc.setLocalDescription(o); socket.emit('signal', { d: pc.localDescription }); }
  });
  socket.on('signal', async s => {
    if (!pc) return;
    try {
      if (s.d) { await pc.setRemoteDescription(s.d); if (s.d.type === 'offer') { const a = await pc.createAnswer(); await pc.setLocalDescription(a); socket.emit('signal', { d: pc.localDescription }); } }
      else if (s.c) await pc.addIceCandidate(s.c);
    } catch {}
  });
  socket.on('msg', t => log(t, ''));
  socket.on('gift', g => { log(`${g.from} të dërgoi ${GIFT_ICON[g.type]}`); const el = $('gifts'); el.textContent = GIFT_ICON[g.type]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); });
  socket.on('reported', () => log('Raportimi u dërgua. Faleminderit.'));
  socket.on('partner-left', () => { log('Përdoruesi doli.'); closePC(); inMatch = false; ui(true, false); setStatus('Dikush doli. Kliko Next.'); });
}
function newPC() {
  closePC(); pc = new RTCPeerConnection(ice);
  local.getTracks().forEach(t => pc.addTrack(t, local));
  pc.ontrack = e => $('rv').srcObject = e.streams[0];
  pc.onicecandidate = e => e.candidate && socket.emit('signal', { c: e.candidate });
}
function closePC() { if (pc) { pc.close(); pc = null; } $('rv').srcObject = null; }
function teardown() { closePC(); if (socket) socket.close(); }
function ui(active, matched) {
  $('startBtn').disabled = active; $('nextBtn').disabled = !active; $('stopBtn').disabled = !active;
  ['msgIn', 'sendBtn', 'reportBtn'].forEach(i => $(i).disabled = !matched);
  document.querySelectorAll('[data-gift]').forEach(b => b.disabled = !matched);
}
const find = () => { closePC(); inMatch = false; setStatus('Po kërkojmë…'); socket.emit('find', { country: $('filter').value || undefined }); };
$('startBtn').onclick = find; $('nextBtn').onclick = find;
$('stopBtn').onclick = () => { socket.emit('stop'); closePC(); inMatch = false; ui(false); setStatus('Ndalove. Kliko Fillo.'); };
$('msgForm').onsubmit = e => { e.preventDefault(); const t = $('msgIn').value.trim(); if (!t || !inMatch) return; socket.emit('msg', t); log(t, 'me'); $('msgIn').value = ''; };
$('reportBtn').onclick = () => {
  const reason = prompt('Pse po e raporton? (p.sh. përmbajtje e papërshtatshme, abuzim)'); if (!reason) return;
  let snapshot = '';
  try { const v = $('rv'), c = document.createElement('canvas'); c.width = 320; c.height = 240; c.getContext('2d').drawImage(v, 0, 0, 320, 240); snapshot = c.toDataURL('image/jpeg', .6); } catch {}
  socket.emit('report', { reason, snapshot }); find();
};

if (new URLSearchParams(location.search).get('paid')) history.replaceState({}, '', '/');
mode(false); boot();
</script>
</body>
</html>
